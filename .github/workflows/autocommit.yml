name: Auto Commit

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Modify file
        run: |
          echo "Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > last_updated.txt

      - name: Commit and push
        run: |
          git config user.name 'dhivagar29'
          git config user.email 'dhivagar29@users.noreply.github.com'
          git add last_updated.txt
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Daily activity commit - $(date -u '+%Y-%m-%d')"
          git push
